<body><main class="sheet">
  <a class="back" href="index.html">← WEDDING INVITATION</a>
  <header class="intro"><h1>庄磊　吴郁</h1><p>不做花哨字库展示，只看名字写出来时的笔意、重心和呼吸。</p></header>
  <section class="work one"><div class="label"><span>01 / 行楷 · 落款感</span><i></i></div><div class="names">庄磊<span class="join">·</span>吴郁</div><p class="sub">最像请柬上手写的一行姓名</p></section>
  <section class="work two"><div class="label"><span>02 / 笔触 · 亲密感</span><i></i></div><div class="names">庄磊<span class="join">与</span>吴郁</div><p class="sub">轻一点，像写给彼此的名字</p></section>
  <section class="work three"><div class="label"><span>03 / 端秀 · 纸上题字</span><i></i></div><div class="names">庄磊　吴郁</div><p class="sub">不加符号，让留白成为两个人之间的连接</p></section>
  <section class="work four"><div class="label"><span>04 / 签名 · 松弛感</span><i></i></div><div class="names">庄磊<span class="join">×</span>吴郁<span class="seal">囍</span></div><p class="sub">像一本婚礼相册扉页的两笔签名</p></section>
  <p class="hint">如果这一版仍然不对，请直接说你想避开什么：例如“不要毛笔”“要更像明星签名”“要现代一点”。我会按一句话重做，不再在同一路线上微调。</p>
