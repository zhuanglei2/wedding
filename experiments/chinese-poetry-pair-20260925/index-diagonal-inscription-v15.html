<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151a17">
  <meta name="description" content="时日有序 光景常新 岁月并进 新喜已临">
  <title>长廊 · 新喜已临</title>
  <link rel="stylesheet" href="style-v15.css">
</head>
<body>
  <svg class="palette-filters" width="0" height="0" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="poem-readable-vermillion" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <feFlood flood-color="#E75B48" result="vermillion-ink"/>
        <feComposite in="vermillion-ink" in2="SourceAlpha" operator="in"/>
      </filter>
    </defs>
  </svg>
  <main class="scroll" aria-labelledby="title">
    <figure class="photograph corridor">
      <div class="photo-window">
        <img src="media/corridor-hq-1350-v8.webp"
             srcset="media/corridor-hq-900-v8.webp 900w, media/corridor-hq-1350-v8.webp 1350w, media/corridor-hq-1800-v8.webp 1800w, media/corridor-hq-2400-v9.webp 2400w"
             sizes="(max-width: 600px) 124vw, 644.8px"
             width="1800" height="2700" fetchpriority="high" decoding="async"
             alt="两人相依站在园林木质长廊里，收紧构图突出人物，保留头部、双手和红色裙摆。">
      </div>
      <h1 class="inscription" id="title" aria-label="时日有序 光景常新 岁月并进 新喜已临">
        <svg class="verse verse-opening" viewBox="512 88 190 1422" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" style="filter: url(#poem-readable-vermillion) drop-shadow(0 .7px .9px rgba(0,0,0,.85));">
          <defs>
            <!-- Keep the neighbouring 进's long terminal stroke out of this column. -->
            <clipPath id="opening-column" clipPathUnits="userSpaceOnUse">
              <path d="M522 0H1024V1536H522V805H535V766H522Z"/>
            </clipPath>
          </defs>
          <image href="media/lettering-flowing-v15.webp" width="1024" height="1536" clip-path="url(#opening-column)"/>
        </svg>
        <svg class="verse verse-closing" viewBox="327 156 209 1321" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" style="filter: url(#poem-readable-vermillion) drop-shadow(0 .7px .9px rgba(0,0,0,.85));">
          <defs>
            <clipPath id="closing-column" clipPathUnits="userSpaceOnUse">
              <path d="M0 0H522V766H535V805H522V1536H0Z"/>
            </clipPath>
          </defs>
          <image href="media/lettering-flowing-v15.webp" width="1024" height="1536" clip-path="url(#closing-column)"/>
        </svg>
      </h1>
    </figure>
  </main>
</body>
</html>
