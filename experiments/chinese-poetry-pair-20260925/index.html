<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#151a17">
  <meta name="description" content="时日有序 光景常新 岁月并进 新喜已临">
  <title>长廊 · 新喜已临</title>
  <link rel="stylesheet" href="style-v18.css">
</head>
<body>
  <svg class="palette-filters" width="0" height="0" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="poem-readable-vermillion" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <feFlood flood-color="#E75B48" result="vermillion-ink"/>
        <feComposite in="vermillion-ink" in2="SourceAlpha" operator="in"/>
      </filter>
      <!-- Keep both source columns intact, including the long terminal of 进. -->
      <clipPath id="opening-column-v17" clipPathUnits="userSpaceOnUse">
        <path d="M522 0H1024V1536H522V805H535V766H522Z"/>
      </clipPath>
      <clipPath id="closing-column-v17" clipPathUnits="userSpaceOnUse">
        <path d="M0 0H522V766H535V805H522V1536H0Z"/>
      </clipPath>
    </defs>
  </svg>
  <main class="scroll" aria-labelledby="title">
    <figure class="photograph corridor">
      <div class="photo-window">
        <img src="media/corridor-hq-1350-v8.webp"
             srcset="media/corridor-hq-900-v8.webp 900w, media/corridor-hq-1350-v8.webp 1350w, media/corridor-hq-1800-v8.webp 1800w, media/corridor-hq-2400-v9.webp 2400w"

             width="1800" height="2700" fetchpriority="high" decoding="async"
             alt="两人相依站在园林木质长廊里，收紧构图突出人物，保留头部、双手和红色裙摆。">
      </div>
      <h1 class="inscription" id="title" aria-label="时日有序 光景常新 岁月并进 新喜已临">
        <svg class="verse verse-time" viewBox="514 88 179 676" width="179" height="676" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" style="filter: url(#poem-readable-vermillion) drop-shadow(0 .7px .9px rgba(0,0,0,.85));">
          <image href="media/lettering-flowing-v15.webp" width="1024" height="1536" clip-path="url(#opening-column-v17)"/>
        </svg>
        <svg class="verse verse-light" viewBox="514 770 188 740" width="188" height="740" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" style="filter: url(#poem-readable-vermillion) drop-shadow(0 .7px .9px rgba(0,0,0,.85));">
          <image href="media/lettering-flowing-v15.webp" width="1024" height="1536" clip-path="url(#opening-column-v17)"/>

        <svg class="verse verse-years" viewBox="330 156 205 663" width="205" height="663" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" style="filter: url(#poem-readable-vermillion) drop-shadow(0 .7px .9px rgba(0,0,0,.85));">
          <image href="media/lettering-flowing-v15.webp" width="1024" height="1536" clip-path="url(#closing-column-v17)"/>
        </svg>
        <svg class="verse verse-joy" viewBox="327 823 188 654" width="188" height="654" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" style="filter: url(#poem-readable-vermillion) drop-shadow(0 .7px .9px rgba(0,0,0,.85));">
          <image href="media/lettering-flowing-v15.webp" width="1024" height="1536" clip-path="url(#closing-column-v17)"/>
        </svg>
