<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151a17">
  <meta name="description" content="今夕何夕，见此良人。">
  <title>长廊 · 今夕何夕</title>
  <link rel="stylesheet" href="style-v11.css">
</head>
<body>
  <svg class="palette-filters" width="0" height="0" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="poem-readable-vermillion" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <!-- Slightly strengthen fine strokes at display size, without glow. -->
        <feMorphology in="SourceAlpha" operator="dilate" radius="0.24" result="stronger-strokes"/>
        <feComponentTransfer in="stronger-strokes" result="ink-alpha">
          <feFuncA type="linear" slope="1.15" intercept="0"/>
        </feComponentTransfer>
        <feFlood flood-color="#E75B48" result="vermillion-ink"/>
        <feComposite in="vermillion-ink" in2="ink-alpha" operator="in"/>
      </filter>
    </defs>
  </svg>
  <main class="scroll" aria-labelledby="title">
    <figure class="photograph corridor">
      <div class="photo-window">
        <img src="media/corridor-hq-1350-v8.webp"
             srcset="media/corridor-hq-900-v8.webp 900w, media/corridor-hq-1350-v8.webp 1350w, media/corridor-hq-1800-v8.webp 1800w, media/corridor-hq-2400-v9.webp 2400w"
             sizes="(max-width: 600px) 124vw, 644.8px"
             width="1800" height="2700" fetchpriority="high" decoding="async"
             alt="两人相依站在园林木质长廊里，收紧构图突出人物，保留头部、双手和红色裙摆。">
      </div>
      <h1 class="inscription" id="title">
        <picture>
          <source srcset="media/poem-lettering-ivory-v2.webp" type="image/webp">
          <img src="media/poem-lettering-ivory-v2.png" width="1024" height="1536" alt="今夕何夕，见此良人" decoding="async" style="filter: url(#poem-readable-vermillion) drop-shadow(0 1px 1px rgba(0,0,0,.85));">
        </picture>
      </h1>
    </figure>
  </main>
</body>
</html>
