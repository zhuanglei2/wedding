<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151a17">
  <meta name="description" content="今夕何夕，见此良人。">
  <title>长廊 · 今夕何夕</title>
  <link rel="stylesheet" href="style-v7.css">
</head>
<body>
  <main class="scroll" aria-labelledby="title">
    <figure class="photograph corridor">
      <div class="photo-window">
        <img src="media/corridor-lossless.webp" width="591" height="1280" fetchpriority="high" decoding="async" alt="两人相依站在古典园林的木质长廊里，红裙与深色窗棂相映。">
      </div>
      <h1 class="inscription" id="title">
        <picture>
          <source srcset="media/poem-lettering-v1.webp" type="image/webp">
          <img src="media/poem-lettering-v1.png" width="1024" height="1536" alt="今夕何夕，见此良人" decoding="async">
        </picture>
      </h1>
    </figure>
  </main>
</body>
</html>
