<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1e6d3">
  <meta name="description" content="以婚纱摄影为中心的实景拼贴页面：奶油纸张、朱红拱线和手撕纸边。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Still, together. · 实景拼贴</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #f1e6d3; color-scheme: light; }
    body { margin: 0; min-width: 0; min-height: 100vh; min-height: 100svh; }
    main { width: 100%; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; }
    figure { position: relative; isolation: isolate; aspect-ratio: 3 / 5; width: 100%; max-width: 760px; margin: 0; overflow: hidden; background: #f1e6d3; }
    /* Only the empty upper-right paper sample is visible: source x=809..971, y=0..270. */
    .paper-surface { position: absolute; inset: 0; background: url("poster.webp") right top / 600% auto no-repeat; }
    /* Restrict generated artwork to its paper/architecture region, excluding all generated people. */
    .architecture { position: absolute; inset: 0; background: url("poster.webp") left top / 100% 100% no-repeat; clip-path: polygon(0 0,100% 0,100% 19%,78% 23%,64% 26%,51% 29%,43% 30%,35% 36%,28% 42%,20% 52%,18% 62%,18% 83%,0 83%); }
    .photo-paper, .original-photo { position: absolute; top: 31%; right: 3.5%; bottom: 6%; left: 7%; -webkit-mask: url("tear-mask.svg") center / 100% 100% no-repeat; mask: url("tear-mask.svg") center / 100% 100% no-repeat; }
    .photo-paper { background: #f8efde; transform: translate(-.8%,-.55%); }
    .original-photo { margin: 0; }
    .original-photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 54% 50%; }
    .micro-copy { position: absolute; left: 4.2%; bottom: 2.25%; margin: 0; color: #633b23; font: 400 clamp(10px,2.4vw,21px)/1.3 "Courier New",Courier,monospace; letter-spacing: -.045em; }
    @supports (font-size: 1cqw) { figure { container-type: inline-size; } .micro-copy { font-size: 2.7cqw; } }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (min-width: 700px) {
      figure { width: min(760px, calc(100vh * 971 / 1620)); width: min(760px, calc(100svh * 971 / 1620)); }
    }
    @media print {
      @page { size: 180mm 300mm; margin: 0; }
      html, body, main { min-height: 0; background: transparent; }
      figure { width: 100%; max-width: none; }
      img { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main>
    <figure aria-labelledby="poster-caption">
      <div class="paper-surface" aria-hidden="true"></div>
      <div class="architecture" aria-hidden="true"></div>
      <div class="photo-paper" aria-hidden="true"></div>
      <div class="original-photo">
        <img src="portrait-original.jpg" width="1179" height="786" fetchpriority="high" decoding="async" alt="用户提供的原始婚纱照片，未经 AI 重绘：新郎在左，新娘在右，身穿黑色礼服和完整象牙白婚纱，站在金色宫廷墙面前。">
      </div>
      <p class="micro-copy" lang="en">Still, together.</p>
      <figcaption id="poster-caption" class="sr-only">Still, together. 婚纱摄影与手撕纸拼贴。</figcaption>
    </figure>
  </main>
</body>
</html>
