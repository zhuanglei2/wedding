<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8f1719" />
  <title>宾客登记 · 庄磊 & 吴郁</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600&family=Zhi+Mang+Xing&display=swap');
    :root { --wine:#8f1719; --paper:#f8f4ec; --ink:#211b19; --line:#ddcfbd; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#e8dfd0; font-family:"Noto Serif SC",serif; }
    .page { max-width:540px; min-height:100vh; margin:auto; background:var(--paper); box-shadow:0 0 50px rgba(48,28,18,.15); }
    header { position:relative; min-height:280px; padding:30px 28px; overflow:hidden; color:#fff7e6; background:var(--wine); } header:after { content:"囍"; position:absolute; right:-18px; bottom:-55px; color:#b83936; font:220px/1 "Ma Shan Zheng",cursive; opacity:.55; }
    .back { position:relative; z-index:1; color:#f6dfb6; text-decoration:none; font-size:13px; letter-spacing:.13em; } h1 { position:relative; z-index:1; margin:64px 0 4px; font:62px/.9 "Zhi Mang Xing","Ma Shan Zheng",cursive; letter-spacing:.1em; transform:rotate(-1deg); transform-origin:left; }.en { position:relative; z-index:1; color:#efd8ad; font:italic 17px "DM Serif Display",serif; letter-spacing:.16em; }
    .content { padding:42px 28px 60px; }.notice { margin:0 0 32px; font-size:14px; line-height:2; text-align:center; }form { padding:24px 20px; background:#fffdf9; border:1px solid #ecdfcd; }.field { margin:0 0 22px; } label { display:block; margin-bottom:9px; color:var(--wine); font-size:13px; letter-spacing:.09em; }input, select, textarea { width:100%; padding:12px 0; border:0; border-bottom:1px solid var(--line); outline:0; color:var(--ink); background:transparent; font:14px "Noto Serif SC",serif; }textarea { min-height:70px; resize:vertical; }.choice { display:flex; gap:12px; flex-wrap:wrap; }.choice label { display:flex; align-items:center; gap:5px; margin:0; color:var(--ink); font-size:14px; letter-spacing:0; cursor:pointer; }.choice input { width:auto; accent-color:var(--wine); }button { width:100%; margin-top:8px; padding:14px; cursor:pointer; border:1px solid var(--wine); color:#fff8e9; background:var(--wine); font:14px "Noto Serif SC",serif; letter-spacing:.16em; }
    .location { margin-top:31px; padding:22px 20px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center; }.location b { color:var(--wine); font-size:13px; letter-spacing:.15em; }.location p { margin:11px 0 14px; font-size:14px; }.map { color:var(--wine); font-size:13px; text-decoration:none; border-bottom:1px solid currentColor; }.footer { padding:27px; color:#876e5d; text-align:center; font:12px "DM Serif Display",serif; letter-spacing:.16em; }
  </style>
</head>
<body>
  <main class="page">
    <header><a class="back" href="index.html">← 返回请柬</a><h1>宾客登记</h1><div class="en">RSVP · ZHUANGLEI &amp; WUYU</div></header>
    <section class="content">
      <p class="notice">亲爱的朋友，感谢您见证我们的幸福。<br>请填写下方信息，方便我们为您留好席位。</p>
      <form action="https://formsubmit.co/a1013630965@163.com" method="POST">
        <input type="hidden" name="_subject" value="庄磊 & 吴郁婚礼宾客登记" /><input type="hidden" name="_captcha" value="false" /><input type="hidden" name="_next" value="https://zhuanglei2.github.io/wedding/guest.html?submitted=1" />
        <div class="field"><label for="name">您的姓名 *</label><input id="name" name="姓名" required placeholder="请填写姓名" /></div>
        <div class="field"><label for="phone">联系电话 *</label><input id="phone" name="联系电话" type="tel" required placeholder="方便我们与您联系" /></div>
        <div class="field"><label>是否出席 *</label><div class="choice"><label><input type="radio" name="是否出席" value="出席" required /> 欣然出席</label><label><input type="radio" name="是否出席" value="遗憾无法出席" /> 遗憾无法出席</label></div></div>
        <div class="field"><label for="count">同行人数（含本人）</label><select id="count" name="同行人数"><option value="1">1 人</option><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人及以上</option></select></div>
        <div class="field"><label for="note">想对我们说</label><textarea id="note" name="祝福留言" placeholder="留下您的祝福吧"></textarea></div><button type="submit">提交登记</button>
      </form>
      <div class="location"><b>婚礼地点</b><p>浙江省宁海西子国际大酒店</p><a class="map" target="_blank" rel="noreferrer" href="https://uri.amap.com/marker?position=121.430087,29.296127&name=%E5%AE%81%E6%B5%B7%E8%A5%BF%E5%AD%90%E5%9B%BD%E9%99%85%E5%A4%A7%E9%85%92%E5%BA%97">打开地图导航</a></div>
    </section><footer class="footer">OCTOBER 06 · 2026</footer>
  </main>
  <script>if (new URLSearchParams(location.search).get('submitted')) document.querySelector('.notice').innerHTML = '感谢您的回复，期待与您相见！';</script>
</body>
</html>
