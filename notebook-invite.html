<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#990d16">
  <title>庄磊 & 吴郁 · 婚礼请柬</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
    :root{--red:#9e0a12;--gold:#f0c75b;--cream:#fff5d9}*{box-sizing:border-box}body{margin:0;background:#241812;font-family:"Noto Serif SC",serif}.invite{position:relative;width:min(720px,100%);min-height:100svh;margin:auto;overflow:hidden;background:#1e1511}.photo{display:block;width:100%;min-height:100svh;object-fit:cover;object-position:center center}.veil{position:absolute;inset:0;background:linear-gradient(180deg,#1d0b0c55 0 30%,transparent 56%,#14080924 100%)}.card{position:absolute;z-index:2;left:9%;right:9%;top:7%;padding:27px 24px 31px;text-align:center;color:var(--gold);background:#9e0a12e8;border-radius:7px;box-shadow:0 14px 35px #26030866}.card:before{content:"";position:absolute;inset:10px;border:1px solid var(--gold);border-radius:3px;pointer-events:none}.card>*{position:relative}.happiness{margin:0 0 12px;font-size:40px;line-height:1;color:var(--gold)}.label{margin:0;color:var(--cream);font-size:13px;letter-spacing:.35em}.names{margin:19px 0 13px;font-size:clamp(29px,7vw,45px);font-weight:600;letter-spacing:.22em}.words{margin:0;color:var(--cream);font-size:13px;line-height:1.9;letter-spacing:.13em}.line{width:70%;margin:19px auto;border-top:1px solid var(--gold)}.venue{margin:0;font-size:14px;line-height:1.8;letter-spacing:.08em}.date{margin:10px 0 0;color:var(--cream);font-size:13px;letter-spacing:.17em}.mark{position:absolute;z-index:2;right:7%;bottom:5%;color:#fff9e9e8;text-align:right;text-shadow:0 2px 10px #1b0808}.mark b{display:block;font-size:16px;letter-spacing:.16em}.mark span{display:block;margin-top:6px;font-size:10px;letter-spacing:.23em}@media(min-width:721px){.invite{min-height:960px}.photo{min-height:960px}.card{top:52px;left:64px;right:64px;padding:32px 30px 35px}}
  </style>
</head>
<body>
  <main class="invite">
    <img class="photo" src="assets/portrait-garden.jpg" alt="庄磊和吴郁的婚纱照">
    <div class="veil"></div>
    <section class="card" aria-label="婚礼信息">
      <p class="happiness">囍</p><p class="label">婚 礼 邀 请</p><h1 class="names">庄磊 · 吴郁</h1>
      <p class="words">谨定于 2026 年 10 月 6 日<br>诚邀您见证我们的幸福时刻</p><div class="line"></div>
      <p class="venue">浙江省宁海西子国际大酒店</p><p class="date">10 · 06 · 2026</p>
    </section>
    <p class="mark"><b>庄磊 & 吴郁 敬邀</b><span>WITH LOVE</span></p>
  </main>
</body>
</html>
